<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickMod | Dutkyobot</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: "#000000",
                        surface: "#18181B",
                        line: "#2A2A2E",
                        mute: "#9B9BA3",
                        ink: "#FFFFFF",
                        mint: "#21D67A",
                        blue: "#3B9EFF",
                        discord: "#5865F2",
                    },
                    fontFamily: {
                        sans: ["Pretendard Variable", "Pretendard", "sans-serif"],
                    },
                },
            },
        };
    </script>

    <style>
        /* ==========================================================
           디자인 토큰
           - Tailwind config의 색상과 값을 맞춰서, CSS 쪽에서도
             같은 색을 하드코딩 없이 재사용한다.
        ========================================================== */
        :root {
            --c-mint: #21D67A;
            --c-blue: #3B9EFF;
            --c-red: #EF4444;
            --c-amber: #F5A623;

            --dur-header: 0.5s;
            --ease-header: cubic-bezier(0.22, 1, 0.36, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: #000000;
            color: #FFFFFF;
        }

        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--c-blue);
            outline-offset: 2px;
            border-radius: 4px;
        }

        /* ==========================================================
           헤더: 스크롤에 따라 풀와이드 바 <-> 플로팅 알약으로 전환
        ========================================================== */
        #site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            display: flex;
            justify-content: center;
            padding: 0;
            transition: padding var(--dur-header) var(--ease-header);
        }

        #header-inner {
            width: 100%;
            max-width: 100%;
            height: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0;

            transition: all var(--dur-header) var(--ease-header);
        }

        #header-content {
            width: 100%;
            max-width: 64rem;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #site-header.is-floating {
            padding: 1rem;
        }

        #site-header.is-floating #header-inner {
            max-width: 64rem;
            border-radius: 9999px;

            background: linear-gradient(180deg, rgba(30, 30, 34, 0.65) 0%, rgba(24, 24, 27, 0.65) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);

            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 16px 32px -8px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(255, 255, 255, 0.02);
        }

        /* ==========================================================
           공통 컴포넌트
        ========================================================== */

        /* 폴백 다이어그램 가로 스크롤 영역 커스텀 스크롤바 */
        .themed-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #3A3A40 #18181B;
        }

        .themed-scrollbar::-webkit-scrollbar {
            height: 6px;
        }

        .themed-scrollbar::-webkit-scrollbar-track {
            background: #18181B;
            border-radius: 9999px;
        }

        .themed-scrollbar::-webkit-scrollbar-thumb {
            background: #3A3A40;
            border-radius: 9999px;
        }

        .themed-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #55555C;
        }

        .card {
            background: #18181B;
            border: 1px solid #2A2A2E;
            border-radius: 28px;
            transition: border-color 0.2s ease;
        }
        .card:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }

        .invite-btn {
            transition: opacity 0.2s ease;
        }
        .invite-btn:hover {
            opacity: 0.88;
        }

        .gradient-brand {
            background: linear-gradient(135deg, var(--c-mint) 0%, var(--c-blue) 100%);
        }

        /* 채팅 목업 타이핑 캐럿 */
        .caret {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #9B9BA3;
            margin-left: 2px;
            vertical-align: -0.15em;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ==========================================================
           폴백 릴레이 다이어그램
        ========================================================== */
        .relay-line {
            height: 3px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }
        .relay-line.line-active::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--c-mint), var(--c-blue), transparent);
            animation: line-pass 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes line-pass {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .node-running {
            border-color: var(--c-blue) !important;
            box-shadow: 0 0 18px rgba(59, 158, 255, 0.6);
            animation: node-pulse 0.8s infinite alternate ease-in-out;
        }
        @keyframes node-pulse {
            0% { box-shadow: 0 0 6px rgba(59, 158, 255, 0.3); }
            100% { box-shadow: 0 0 20px rgba(59, 158, 255, 0.8); }
        }

        .node-failed {
            border-color: var(--c-red) !important;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.5);
            animation: node-shake 0.4s ease-in-out;
        }
        @keyframes node-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .node-success {
            border-color: var(--c-mint) !important;
            box-shadow: 0 0 22px rgba(33, 214, 122, 0.7);
            animation: node-success-glow 1.5s infinite alternate ease-in-out;
        }
        @keyframes node-success-glow {
            0% { box-shadow: 0 0 10px rgba(33, 214, 122, 0.4); }
            100% { box-shadow: 0 0 25px rgba(33, 214, 122, 0.8); }
        }

        @media (prefers-reduced-motion: reduce) {
            .relay-line.line-active::after,
            .caret {
                animation: none;
            }
            #site-header,
            #header-inner,
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased">

    <header id="site-header">
        <div id="header-inner">
            <div id="header-content">
                <a href="index.html" class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-[0.5rem] gradient-brand flex items-center justify-center">
                        <i class="fas fa-shield-halved text-white text-sm" aria-hidden="true"></i>
                    </div>
                    <span class="text-lg font-bold tracking-tight text-ink">QuickMod</span>
                </a>

                <div class="flex items-center gap-4 sm:gap-6">
                    <a
                        href="https://discord.gg/AdM4hFZkrE"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="text-sm font-semibold text-mute hover:text-ink transition-colors"
                    >
                        서포트 서버
                    </a>
                    <a
                        href="https://discord.com/oauth2/authorize?client_id=1566306130194599948&amp;scope=bot%20applications.commands&amp;permissions=1099511712772"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="invite-btn hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-full bg-discord text-white text-sm font-semibold shadow-sm"
                    >
                        <i class="fab fa-discord text-sm"></i>
                        초대하기
                    </a>
                </div>
            </div>
        </div>
    </header>


    <main class="flex-1 max-w-5xl mx-auto w-full px-6 pt-32 pb-20 sm:pt-36 sm:pb-28">

        <div class="flex items-center justify-center min-h-[50vh]">
            <p class="text-ink text-xl font-semibold">페이지 준비중입니다</p>
        </div>

    </main>


    <footer class="py-9 border-t border-line mt-auto">
        <div class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row justify-center sm:justify-between items-center text-mute text-sm gap-4">
            <div class="flex items-center gap-2">
                <span class="font-bold text-ink">QuickMod</span>
                <span>&copy; 2026. All Rights Reserved.</span>
            </div>

            <div class="flex items-center gap-4">
                <a href="https://discord.gg/AdM4hFZkrE" target="_blank" rel="noopener noreferrer" class="font-medium hover:text-ink transition-colors">
                    서포트 서버
                </a>
                <span class="w-1 h-1 rounded-full bg-line"></span>
                <span class="text-xs">Powered by Dutkyobot</span>
            </div>
        </div>
    </footer>


    <script>
    /* 헤더: 스크롤 위치에 따라 플로팅 스타일 전환 */
    (function () {
        var header = document.getElementById("site-header");
        if (!header) return;

        window.addEventListener(
            "scroll",
            function () {
                header.classList.toggle("is-floating", window.scrollY > 20);
            },
            { passive: true }
        );
    })();
    </script>

</body>
</html>
